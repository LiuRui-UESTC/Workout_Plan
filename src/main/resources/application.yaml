spring:
  application:
    name: code_sports_rui_and_fei
  datasource:
    url: jdbc:h2:file:./data/fitness_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# JWT配置
app:
  jwt:
    secret: ruifei-fitness-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration: 604800000  # 7天
